{% extends "base.html" %}
{% block titulo %}Entrar — App-EdiLoja{% endblock %}

{% block contenido %}
<div class="ed-acceso">
  <h1>Entrar</h1>
  <p class="ed-meta">Guías didácticas · UTPL</p>

  {% if error %}
    <p class="ed-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/entrar">
    <label for="correo">Correo institucional</label>
    <input id="correo" name="correo" type="email" required autofocus
           autocomplete="username" placeholder="nombre@utpl.edu.ec">

    <label for="contrasena">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" required
           autocomplete="current-password">

    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
