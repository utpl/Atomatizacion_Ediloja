<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador de Guías Didácticas — Word → JSON · EdiLoja</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --nav:#003f72; --nav-hover:#00304f; --primary:#003f72; --primary-dark:#00304f;
    --link:#0E68B3; --sec:#eaab00; --sec-dark:#c99200;
    --border:#C7CDD1; --border-light:#E8EAEC; --bg:#F5F7FA; --ink:#273540; --muted:#5B6770;
    --ok:#0B874B; --ok-bg:#E6F4EC; --warn:#8F6A00; --warn-bg:#FDF6E3; --err:#C22132; --err-bg:#FCEEF0;
    --tema:#556572; --act:#BF5E0E; --quiz:#0B874B; --tabla:#7A5CA3; --caja:#B08A00;
  }
  a{color:var(--link)}
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:15px}
  body{font-family:Lato,'Lucida Grande','Helvetica Neue',Arial,sans-serif;color:var(--ink);background:#fff;display:flex;min-height:100vh}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  table{border-collapse:collapse}

  .rail{width:54px;background:var(--nav);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px}
  .rail .logo{width:38px;height:38px;border-radius:50%;background:var(--sec);color:#fff;font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .rail span{color:#fff;opacity:.85;font-size:.54rem;text-align:center;padding:8px 2px;line-height:1.3}

  .lista{width:262px;flex-shrink:0;border-right:1px solid var(--border);background:#fff;overflow-y:auto;display:flex;flex-direction:column}
  .lista h1{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:16px 16px 8px}
  .g-btn{display:block;width:100%;text-align:left;padding:10px 14px 10px 12px;border-left:4px solid transparent;border-bottom:1px solid var(--border-light)}
  .g-btn:hover{background:#F2F6F8}
  .g-btn[aria-pressed="true"]{border-left-color:var(--primary);background:#EBF4FA}
  .g-btn .code{font-size:.7rem;font-weight:700;color:var(--link)}
  .g-btn .name{font-size:.85rem;font-weight:700;line-height:1.25;margin:2px 0}
  .g-btn .meta{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:var(--ok)} .dot.warn{background:#D9A600} .dot.err{background:var(--err)}
  .subir-mini{margin:auto 12px 14px;border:1px dashed var(--border);border-radius:6px;padding:10px;text-align:center;font-size:.78rem;color:var(--muted)}
  .subir-mini:hover{background:#F2F6F8;border-color:var(--primary);color:var(--primary)}

  main{flex:1;min-width:0}
  .vacio{max-width:640px;margin:8vh auto;padding:0 24px}
  .vacio h2{font-weight:400;font-size:1.7rem;margin-bottom:6px}
  .vacio p{color:var(--muted);margin-bottom:22px}
  .drop{border:2px dashed var(--border);border-radius:8px;padding:56px 24px;text-align:center;background:#FAFBFC;cursor:pointer}
  .drop.arrastrando{border-color:var(--primary);background:#EBF4FA}
  .drop svg{width:44px;height:44px;color:var(--primary);margin-bottom:10px}
  .drop .t1{font-size:1.05rem;font-weight:700}
  .drop .t2{font-size:.82rem;color:var(--muted);margin-top:4px}
  .pasos{display:flex;gap:14px;margin-top:26px}
  .paso{flex:1;border:1px solid var(--border);border-radius:6px;padding:14px}
  .paso .k{font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--primary);text-transform:uppercase}
  .paso .d{font-size:.82rem;margin-top:4px;line-height:1.4}

  .cargando{display:flex;align-items:center;gap:12px;margin:60px auto;justify-content:center;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}

  .cab{padding:18px 26px 8px}
  .cab h2{font-weight:400;font-size:1.6rem}
  .cab .sub{margin-top:4px;font-size:.85rem;color:var(--muted)}
  .cab .sub b{color:var(--ink)}

  .semaforo{margin:12px 26px;border-radius:6px;padding:13px 16px;display:flex;gap:12px;align-items:flex-start;max-width:1020px}
  .semaforo svg{width:22px;height:22px;flex-shrink:0;margin-top:1px}
  .semaforo .tt{font-weight:700;font-size:.95rem}
  .semaforo .dd{font-size:.82rem;margin-top:2px}
  .semaforo.ok{background:var(--ok-bg);border:1px solid #9BD3B4;color:#0A5B34}
  .semaforo.err{background:var(--err-bg);border:1px solid #F1A3AC;color:#87121F}
  .semaforo .acciones{margin-left:auto;flex-shrink:0;display:flex;gap:8px}
  .btn{border:1px solid var(--border);border-radius:4px;padding:8px 14px;font-size:.85rem;background:#fff;font-weight:700}
  .btn:hover{background:#F2F6F8}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.pri:hover{background:var(--primary-dark)}
  .btn.sec{background:var(--sec);border-color:var(--sec);color:#fff}
  .btn.sec:hover{background:var(--sec-dark)}

  .correcciones{margin:0 26px 8px;max-width:1020px}
  .corr{border:1px solid #F1A3AC;background:var(--err-bg);border-radius:4px;padding:9px 12px;font-size:.82rem;margin-bottom:6px}
  .corr b{color:#87121F}
  .corr .fix{display:block;margin-top:2px;color:#5c3b40}
  .nota-info{border:1px solid #EBDFAE;background:var(--warn-bg);border-radius:4px;padding:9px 12px;font-size:.82rem;margin-bottom:6px;color:#6b5300}

  .panel{margin:14px 26px;max-width:1020px;border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .panel > h3{background:var(--bg);padding:9px 14px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
  .cotejo{width:100%;font-size:.83rem}
  .cotejo th,.cotejo td{text-align:left;padding:7px 14px;border-bottom:1px solid var(--border-light)}
  .cotejo th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .cotejo tr:last-child td{border-bottom:none}
  .est{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px}
  .est.pen{background:#EBF4FA;color:var(--primary-dark)}
  .est.falta{background:var(--err-bg);color:var(--err)}
  .fuente{color:var(--muted);font-size:.72rem}

  .stats{display:flex;flex-wrap:wrap;gap:10px;padding:2px 26px 4px;max-width:1020px}
  .stat{border:1px solid var(--border);border-radius:4px;padding:7px 13px;min-width:92px}
  .stat .n{font-size:1.2rem;font-weight:700}
  .stat .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .stat.warn .n{color:var(--err)}

  .estructura{padding:4px 26px 60px;max-width:1020px}
  .bim{margin:20px 0 8px;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
  .bim::after{content:"";flex:1;height:1px;background:var(--border)}
  .ra{border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:4px;background:#F7FAFC;padding:9px 13px;margin:10px 0;font-size:.83rem}
  .ra b{color:var(--primary-dark)}
  .ra-ctx{margin-top:5px;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--border-light);padding-top:5px}
  .ra-ctx b{color:var(--ink);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
  .ra-ctx.pendiente{color:#7A5CA3;font-style:italic;border-top-style:dotted}

  .mod{border:1px solid var(--border);border-radius:4px;margin:9px 0;background:#fff;overflow:hidden}
  .mod-h{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);text-align:left}
  .mod-h:hover{background:#EDEFF1}
  .mod-h .tri{transition:transform .15s;color:var(--muted);flex-shrink:0}
  .mod[data-open="true"] .mod-h .tri{transform:rotate(90deg)}
  .mod-h .wk{font-weight:700;font-size:.93rem;white-space:nowrap}
  .mod-h .un{font-size:.77rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mod-h .nb{margin-left:auto;flex-shrink:0;font-size:.7rem;color:var(--muted)}
  .mod-b{display:none;border-top:1px solid var(--border);max-height:520px;overflow-y:auto}
  .mod[data-open="true"] .mod-b{display:block}
  .bq{display:flex;gap:10px;padding:8px 16px 8px 34px;border-bottom:1px solid var(--border-light);font-size:.84rem;align-items:flex-start}
  .bq:last-child{border-bottom:none}
  .bq .ic{flex-shrink:0;width:15px;height:15px;margin-top:2px}
  .bq.encabezado{font-weight:700}
  .bq.encabezado .ic{color:var(--tema)}
  .bq.parrafo .ic,.bq.lista .ic{color:#9AA6AF}
  .bq.lista{padding-left:48px}
  .bq.tabla .ic{color:var(--tabla)}
  .bq.caja{background:#FDF8E7}
  .bq.caja .ic{color:var(--caja)}
  .bq.cuadro_texto{background:var(--warn-bg)}
  .bq.cuadro_texto .ic{color:var(--warn)}
  .bq.imagen .ic{color:#3A87AD}
  .bq.autoevaluacion_ref{background:var(--ok-bg);font-weight:700}
  .bq.focalizador{background:#FFFDF7;border-left:4px solid #E26D0E;padding-top:10px;padding-bottom:10px}
  .bq.focalizador .ic{color:#E26D0E}
  .foc-badge{display:inline-block;background:#E26D0E;color:#fff;font-size:.62rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:10px;margin-bottom:4px}
  .foc-icono{font-size:.68rem;color:var(--muted);margin-left:6px}
  .bq.actividades{display:block;background:#FBF7F1;border:1px solid #E5C9A3;border-left:4px solid #BF5E0E;
    border-radius:4px;margin:8px 14px;padding:0}
  .bq.actividades.evaluadas{background:#F1F7F3;border-color:#A3CDB4;border-left-color:#0B874B}
  .act-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-light)}
  .act-head b{font-size:.9rem}
  .act-badge{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 9px;border-radius:10px;background:#BF5E0E;color:#fff}
  .bq.actividades.evaluadas .act-badge{background:#0B874B}
  .bq.cita{background:#F7F8F9;border-left:4px solid #9AA6AF;font-style:italic}
  .bq.cita .ic{color:#9AA6AF}
  .bq.cita .autor{display:block;text-align:right;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:4px}
  .bq.recurso_ediloja{background:#FDF0F5;border-left:4px solid #C2185B}
  .bq.recurso_ediloja .ic{color:#C2185B}
  .bq.recurso_ediloja .rec-badge{display:inline-block;background:#C2185B;color:#fff;font-size:.62rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:10px;margin-bottom:4px}
  .bq.smartart{background:#F3EDFB;border-left:3px solid #7A5CA3}
  .bq.smartart .ic{color:#7A5CA3}
  .bq.smartart .etiqueta-ia{display:inline-block;background:#7A5CA3;color:#fff;font-size:.62rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-bottom:4px}
  .bq.smartart ol{margin:4px 0 0 18px}
  .bq img{max-width:min(420px,100%);height:auto;border:1px solid var(--border);border-radius:4px;display:block;margin:2px 0}
  .bq .pie-figura{font-size:.74rem;color:var(--muted);font-style:italic}
  .bq .nombre-figura{font-size:.7rem;color:var(--primary);font-weight:700}
  .t-titulo{font-weight:700;font-size:.8rem;margin-bottom:3px}
  .t-nota{font-size:.75rem;color:var(--muted);font-style:italic;margin-top:3px}
  .bq .num{color:var(--primary-dark);font-weight:700;margin-right:4px}
  .bq ul,.bq ol{margin:0 0 0 20px;padding:0}
  .bq li{margin:3px 0}
  .bq.autoevaluacion_ref .ic{color:var(--quiz)}
  .bq .tx{min-width:0;word-break:break-word;white-space:pre-wrap}
  .bq .tx a{color:var(--primary)}
  .mini-tabla{border:1px solid var(--border);font-size:.76rem;margin-top:2px}
  .mini-tabla td,.mini-tabla th{border:1px solid var(--border-light);padding:3px 7px;vertical-align:top}
  .mini-tabla th{background:var(--bg)}
  .ecu{display:inline-block;background:#EEF;border:1px solid #CCD;border-radius:3px;padding:0 5px;font-family:monospace;font-size:.76rem;margin:1px 2px}

  .autos .fila{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-light);font-size:.85rem;flex-wrap:wrap}
  .autos .fila:last-child{border-bottom:none}
  .badge{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:10px}
  .badge.ok{background:var(--ok-bg);color:#0A5B34}
  .badge.err{background:var(--err-bg);color:var(--err)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.conf{color:#7A5CA3;border-color:#CBBBE3;background:#F8F5FC}
  .autos .det{color:var(--muted);font-size:.74rem}
  .autos .ver{margin-left:auto;color:var(--primary);font-size:.78rem;font-weight:700}
  .autos .cuerpo{display:none;width:100%;border:1px solid var(--border-light);border-radius:4px;margin-top:6px;max-height:340px;overflow-y:auto}
  .autos .fila[data-open="true"] .cuerpo{display:block}

  .pills{padding:10px 14px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:14px;padding:4px 12px;font-size:.78rem;margin:0 6px 6px 0}
  .pill.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .pill.off{color:var(--muted);border-style:dashed}
  .pill.off::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--err)}

  .sem-nav{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:14px 0 10px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:5;border-bottom:1px solid var(--border-light)}
  .sem-nav .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
  .sem-nav button{border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:.8rem;font-weight:700;background:#fff;color:var(--ink)}
  .sem-nav button:hover{border-color:var(--link);color:var(--link)}
  .sem-nav button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
  .sem-nav .flecha{border-radius:4px;padding:5px 10px}
  .vista-switch{display:flex;gap:6px;margin:0 26px 10px;max-width:1020px}
  .vista-switch button{border:1px solid var(--border);border-radius:4px;padding:7px 16px;font-size:.84rem;background:#F5F5F5;font-weight:700}
  .vista-switch button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
  #canvas-zona{margin:0 26px 40px;max-width:1320px}
  #canvas-zona .barra{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  #canvas-zona select{font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:4px;min-width:180px}
  #canvas-frame{width:100%;height:74vh;border:1px solid var(--border);border-radius:4px;background:#fff}
  .error-carga{max-width:640px;margin:20px auto;border:1px solid #F1A3AC;background:var(--err-bg);border-radius:6px;padding:14px 18px;color:#87121F;font-size:.9rem}

  @media (max-width:900px){
    body{flex-direction:column}
    .rail{display:none}
    .lista{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
    .lista h1{display:none}
    .g-btn{min-width:185px;border-left:none;border-top:4px solid transparent;border-bottom:none;border-right:1px solid var(--border-light)}
    .g-btn[aria-pressed="true"]{border-top-color:var(--primary)}
    .subir-mini{margin:8px;min-width:130px}
    .semaforo{flex-wrap:wrap}
    .semaforo .acciones{margin-left:0;width:100%}
    .pasos{flex-direction:column}
  }
</style>
</head>
<body>
  <nav class="rail" aria-label="Navegación global">
    <div class="logo">EDI</div>
    <span>Validador<br>Word→JSON</span>
  </nav>

  <nav class="lista" aria-label="Guías procesadas">
    <h1>Guías procesadas</h1>
    <div id="g-lista"></div>
    <button class="subir-mini" id="subir-otra">＋ Subir otra guía (.docx)</button>
  </nav>

  <main id="main"></main>
  <input type="file" id="file-input" accept=".docx" multiple hidden>

<script>/* Núcleo del pipeline Word → JSON de curso (v2.1) — JavaScript.
   v2.1: numeración automática de Word (numbering.xml), unidad dentro de la
   página, listas agrupadas <ol>/<ul>, tabla como sección (título+tabla+nota),
   imágenes → Imagenes/FiguraN, texto de SmartArt para generación posterior. */
(function (root) {
"use strict";
const W  = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const M  = "http://schemas.openxmlformats.org/officeDocument/2006/math";
const A  = "http://schemas.openxmlformats.org/drawingml/2006/main";
const R  = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const DGM= "http://schemas.openxmlformats.org/drawingml/2006/diagram";
const WP = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";

/* Diccionario canónico (fuente: config_canonico.json). Editar variantes ahí
   y regenerar; no es necesario tocar la lógica. */
const CONFIG = {
  "version": "1.0",
  "tolerancia_difusa": 2,
  "estilos_marca_prefijo": "GD-",
  "anclas": {
    "datos": ["datos de informacion", "datos informativos", "informacion general"],
    "metodologia": ["metodologia de aprendizaje", "metodologia", "orientaciones metodologicas"],
    "orientaciones": ["orientaciones didacticas por resultados de aprendizaje",
                      "orientaciones didacticas por resultados de aprenizaje",
                      "orientaciones didacticas"],
    "referencias": ["referencias bibliograficas", "referencias", "bibliografia", "lista de referencias"],
    "solucionario": ["solucionario", "solucionarios", "solucionario de las autoevaluaciones"],
    "glosario": ["glosario", "glosario de terminos"],
    "anexos": ["anexos", "anexo"]
  },
  "subsecciones_datos": {
    "presentacion": ["presentacion de la asignatura", "presentacion"],
    "competencias_genericas": ["competencias genericas de la utpl", "competencia generica de la utpl"],
    "competencias_perfil": ["competencias del perfil profesional", "competencias especificas de la carrera"],
    "problematica": ["problematica que aborda la asignatura", "problematica"]
  },
  "marcadores": {
    "semana": "^semana\\s*(\\d{1,2})\\s*[:.\\-]?\\s*$",
    "resultado": "^resultados?\\s+de\\s+apr\\w*\\s*(\\d+)?\\s*[:.]?\\s*$",
    "unidad": "^unidad\\s*(\\d{1,2})\\s*[:.\\-]?\\s*(.*)$",
    "autoevaluacion": "^autoevaluaci\\w+\\s*[:.]?\\s*(.*)$",
    "bimestre": "^(primer|segundo)\\s+bimestre$|^planificacion\\s+del\\s+modulo$",
    "actividades_recomendadas": "^actividad(es)?\\b.*recomendad",
    "actividades_evaluadas": "^actividad(es)?\\b.*(evaluad|calificad)",
    "contextualizacion": "^contextualizaci",
    "focalizador_inicio": "^inicio\\s+focalizador\\s+(.+?)\\s*$",
    "focalizador_fin": "^fin\\s+focalizador"
  },
  "focalizadores": [
    ["informacion importante", "Información importante"],
    ["orientacion a actividades", "Orientación a actividades"],
    ["muy bien", "Muy bien"], ["apuntar", "Apuntar"], ["avancemos", "Avancemos"],
    ["buscar", "Buscar"], ["caso", "Caso"], ["ejemplo", "Ejemplo"],
    ["ejercicio", "Ejercicio"], ["enlace", "Enlace"], ["foro", "Foro"],
    ["importante", "Importante"], ["lectura", "Lectura"], ["nota", "Nota"],
    ["observe", "Observe"], ["recuerde", "Recuerde"], ["reflexione", "Reflexione"],
    ["video", "Video"]
  ]
};

/* ---------------------------------------------------------- utilidades */
function norm(s){
  s = (s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return s.replace(/\s+/g," ");
}
const ROM = {i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12,xiii:13,xiv:14,xv:15,xvi:16};
function numDe(t){
  let m = /\b(\d{1,2})\b/.exec(t||"");
  if (m) return parseInt(m[1],10);
  m = /\b([ivx]{1,4})\b/.exec(norm(t));
  return m ? (ROM[m[1]]||null) : null;
}
function editDist(a,b,tol){
  if (Math.abs(a.length-b.length)>tol) return tol+1;
  let d=0,i=0,j=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){i++;j++;}
    else{d++; if(a.length>b.length)i++; else if(b.length>a.length)j++; else {i++;j++;}
         if(d>tol) return d;}
  }
  return d+(a.length-i)+(b.length-j);
}
function fuzzy(nt, candidatos, tol){
  tol = tol==null?2:tol;
  return candidatos.some(c => nt===c || editDist(nt,c,tol)<=tol);
}
function hijos(el, ns, nombre){
  const out=[];
  for(let n=el.firstChild;n;n=n.nextSibling)
    if(n.nodeType===1 && n.localName===nombre && n.namespaceURI===ns) out.push(n);
  return out;
}
function desc(el, ns, nombre){ return Array.from(el.getElementsByTagNameNS(ns, nombre)); }
function attrW(el, nombre){ return el.getAttributeNS(W,nombre) ?? el.getAttribute("w:"+nombre); }
function dentroDeTxbx(n, tope){
  for(let p=n.parentNode; p && p!==tope; p=p.parentNode)
    if(p.localName==="txbxContent") return true;
  return false;
}
function textoDe(el, excluirTxbx){
  let out="";
  (function walk(n){
    for(let c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType!==1) continue;
      if(excluirTxbx && c.localName==="txbxContent") continue;
      if(c.namespaceURI===W && c.localName==="t"){ out+=c.textContent||""; continue; }
      if(c.namespaceURI===W && (c.localName==="tab"||c.localName==="br")){ out+=" "; continue; }
      walk(c);
    }
  })(el);
  return out;
}

/* ------------------------------------ numeración automática de Word */
function mapaNumeracion(numDoc){
  const abstracts={}, nums={};
  if(!numDoc) return {abstracts,nums};
  for(const an of desc(numDoc,W,"abstractNum")){
    const aid = an.getAttributeNS(W,"abstractNumId") ?? an.getAttribute("w:abstractNumId");
    const lvls={};
    for(const lvl of hijos(an,W,"lvl")){
      const il = parseInt(attrW(lvl,"ilvl"),10);
      const g = tag => { const e=hijos(lvl,W,tag)[0]; return e?attrW(e,"val"):null; };
      lvls[il] = {fmt:g("numFmt")||"decimal", lvlText:g("lvlText")||"", start:parseInt(g("start")||"1",10)};
    }
    abstracts[aid]=lvls;
  }
  for(const n of desc(numDoc,W,"num")){
    const nid = n.getAttributeNS(W,"numId") ?? n.getAttribute("w:numId");
    const a = hijos(n,W,"abstractNumId")[0];
    const overrides={};
    for(const lo of hijos(n,W,"lvlOverride")){
      const il=parseInt(attrW(lo,"ilvl"),10);
      const so=hijos(lo,W,"startOverride")[0];
      if(so) overrides[il]=parseInt(attrW(so,"val"),10);
    }
    nums[nid]={aid: a?attrW(a,"val"):null, overrides};
  }
  return {abstracts,nums};
}
function romano(n){
  const t=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
           [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let r=""; for(const[v,s]of t){while(n>=v){r+=s;n-=v;}} return r;
}
function fmtVal(fmt,v){
  if(fmt==="lowerLetter") return String.fromCharCode(97+((v-1)%26));
  if(fmt==="upperLetter") return String.fromCharCode(65+((v-1)%26));
  if(fmt==="lowerRoman")  return romano(v).toLowerCase();
  if(fmt==="upperRoman")  return romano(v);
  if(fmt==="none"||fmt==="bullet") return "";
  return String(v);
}
function crearContador(info){
  const estados={};
  return { next(numId, ilvl){
    const inf=info.nums[numId]; if(!inf) return null;
    const lvls=info.abstracts[inf.aid]; if(!lvls||!lvls[ilvl]) return null;
    let st=estados[inf.aid]; if(!st) st=estados[inf.aid]={c:{}};
    const startDe=k=> inf.overrides[k]!=null ? inf.overrides[k] : (lvls[k]?lvls[k].start:1);
    st.c[ilvl] = st.c[ilvl]==null ? startDe(ilvl) : st.c[ilvl]+1;
    for(const k of Object.keys(st.c)) if(parseInt(k,10)>ilvl) delete st.c[k];
    const lv=lvls[ilvl];
    if(lv.fmt==="bullet") return {fmt:"bullet", texto:""};
    const texto=(lv.lvlText||"").replace(/%(\d)/g,(_,d)=>{
      const k=parseInt(d,10)-1;
      const v=st.c[k]!=null?st.c[k]:startDe(k);
      return fmtVal(lvls[k]?lvls[k].fmt:"decimal", v);
    });
    return {fmt:lv.fmt, texto};
  }};
}

/* -------------------------------------------- lectura de estilos/rels */
function mapaEstilos(stylesDoc){
  const map={};
  if(!stylesDoc) return map;
  for(const st of desc(stylesDoc,W,"style")){
    const id = st.getAttributeNS(W,"styleId") ?? st.getAttribute("w:styleId");
    const nameEl = hijos(st,W,"name")[0];
    const name = nameEl ? attrW(nameEl,"val") : id;
    const basedEl = hijos(st,W,"basedOn")[0];
    let outline=null, numId=null, ilvl=0;
    const ppr = hijos(st,W,"pPr")[0];
    if(ppr){
      const ol=hijos(ppr,W,"outlineLvl")[0];
      if(ol) outline=parseInt(attrW(ol,"val"),10)+1;
      const np=hijos(ppr,W,"numPr")[0];
      if(np){
        const ni=hijos(np,W,"numId")[0], il=hijos(np,W,"ilvl")[0];
        if(ni) numId=attrW(ni,"val");
        if(il) ilvl=parseInt(attrW(il,"val"),10);
      }
    }
    if(id) map[id]={name:name||id, outline, numId, ilvl,
                    basedOn: basedEl?attrW(basedEl,"val"):null};
  }
  // resolver numeración y nivel de esquema heredados por basedOn
  for(const id of Object.keys(map)){
    let cur=map[id], saltos=0;
    while(cur && cur.numId==null && cur.basedOn && saltos++<10) cur=map[cur.basedOn];
    if(cur && cur.numId!=null && map[id].numId==null){
      map[id].numId=cur.numId; map[id].ilvl=cur.ilvl;
    }
    cur=map[id]; saltos=0;
    while(cur && cur.outline==null && cur.basedOn && saltos++<10) cur=map[cur.basedOn];
    if(cur && cur.outline!=null && map[id].outline==null) map[id].outline=cur.outline;
  }
  return map;
}
function mapaRels(relsDoc){
  const map={};
  if(!relsDoc) return map;
  for(const rel of Array.from(relsDoc.getElementsByTagName("Relationship")))
    map[rel.getAttribute("Id")]=rel.getAttribute("Target");
  return map;
}

/* ------------------------------------------------ lectura de bloques */
function leerParrafo(p, ctx, bid){
  const {estilos, rels, contador, diagramas} = ctx;
  const ppr = hijos(p,W,"pPr")[0];
  let styleId=null;
  if(ppr){ const ps=hijos(ppr,W,"pStyle")[0]; if(ps) styleId=attrW(ps,"val"); }
  const stInfo = styleId && estilos[styleId] ? estilos[styleId] : {name:styleId||"Normal", outline:null, numId:null, ilvl:0};
  const estilo = stInfo.name || "Normal";
  let nivel=null;
  let m=/heading (\d)/i.exec(estilo)||/t.tulo (\d)/i.exec(estilo);
  if(m) nivel=parseInt(m[1],10);
  if(nivel==null && ppr){
    const ol=hijos(ppr,W,"outlineLvl")[0];
    if(ol) nivel=parseInt(attrW(ol,"val"),10)+1;
  }
  if(nivel==null && stInfo.outline) nivel=stInfo.outline;
  // numeración efectiva: numPr directo del párrafo, o el del estilo
  let numId=null, ilvl=0, directo=false;
  if(ppr){
    const np=hijos(ppr,W,"numPr")[0];
    if(np){
      const ni=hijos(np,W,"numId")[0], il=hijos(np,W,"ilvl")[0];
      if(ni){ numId=attrW(ni,"val"); directo=true; }
      if(il) ilvl=parseInt(attrW(il,"val"),10);
    }
  }
  if(numId==null && stInfo.numId!=null){ numId=stInfo.numId; ilvl=stInfo.ilvl||0; }
  if(numId==="0") numId=null;
  let alineacion=null, sangria=0;
  if(ppr){
    const jc=hijos(ppr,W,"jc")[0];
    if(jc) alineacion=attrW(jc,"val");
    const ind=hijos(ppr,W,"ind")[0];
    if(ind) sangria=parseInt(attrW(ind,"left")||ind.getAttributeNS(W,"start")||"0",10)||0;
  }
  const texto = textoDe(p,true).replace(/\s+/g," ").trim();
  let numeracion=null, listaTipo=null;
  if(numId!=null){
    const r=contador.next(numId,ilvl);
    if(r){ listaTipo = r.fmt==="bullet"?"ul":"ol";
           if(r.fmt!=="bullet" && r.texto) numeracion=r.texto; }
  }
  // numeración escrita a mano en el texto: "1.1.Título", "2.1.1. Título", "3.7 Título"
  let textoSinNum=null;
  if(numeracion==null){
    const mnum=/^(\d+(?:\.\d+)+)\.?\s*(.+)$/.exec(texto);
    if(mnum && mnum[2].length>2){ numeracion=mnum[1]+"."; textoSinNum=mnum[2].trim(); }
  }
  let esLista = numId!=null && !nivel;
  // numeración automática multinivel corta ("1.1", "2.3.1") = subtítulo, no ítem de lista
  if(esLista && numeracion && /\d+\.\d+/.test(numeracion) && texto.length<90 && texto.length>2){
    const puntos=(numeracion.match(/\./g)||[]).length;
    nivel = Math.min(6, 1+puntos);
    esLista=false;
  }
  // negrita dominante
  let runsT=0, runsB=0;
  for(const r of desc(p,W,"r")){
    if(dentroDeTxbx(r,p)) continue;
    if(!textoDe(r,false).trim()) continue;
    runsT++;
    const rpr=hijos(r,W,"rPr")[0];
    if(rpr){ const b=hijos(rpr,W,"b")[0];
      if(b){ const v=attrW(b,"val"); if(v!=="0"&&v!=="false") runsB++; } }
  }
  const negrita = runsT>0 && runsB===runsT;
  // hipervínculos
  const links=[];
  for(const h of desc(p,W,"hyperlink")){
    const rid=h.getAttributeNS(R,"id")||h.getAttribute("r:id");
    const url=rid&&rels[rid]?rels[rid]:null;
    const txt=textoDe(h,false).trim();
    if(url||txt) links.push({texto:txt,url});
  }
  // ecuaciones OMML
  const ecuaciones=[];
  for(const om of desc(p,M,"oMath")){
    let ec=""; for(const t of desc(om,M,"t")) ec+=t.textContent||"";
    ecuaciones.push(ec.slice(0,200));
  }
  // imágenes (guardamos la ruta interna del zip; luego se renombran a FiguraN)
  const imagenes=[];
  for(const blip of desc(p,A,"blip")){
    const rid=blip.getAttributeNS(R,"embed")||blip.getAttribute("r:embed");
    if(rid&&rels[rid]) imagenes.push(rels[rid]);
  }
  // nombre original de la imagen (wp:docPr) — ahí sobrevive "foc_Recuerde.png"
  // y el atributo descr es el TEXTO ALTERNATIVO (accesibilidad)
  const nombresImg=[]; let altText=null;
  for(const dp of desc(p,WP,"docPr")){
    const nm=dp.getAttribute("name")||"", ds=dp.getAttribute("descr")||"";
    if(nm) nombresImg.push(nm);
    if(ds){ nombresImg.push(ds); if(!altText) altText=ds; }
  }
  // SmartArt: dgm:relIds → r:dm apunta al data model del diagrama
  const smartarts=[];
  for(const ri of desc(p,DGM,"relIds")){
    const rid=ri.getAttributeNS(R,"dm")||ri.getAttribute("r:dm");
    const target=rid&&rels[rid]?rels[rid]:null;
    if(target && diagramas[target]) smartarts.push({origen:target, textos:diagramas[target]});
  }
  // --- caso EdiLoja 1: imagen inline en el MISMO párrafo que el título "Figura N ..."
  if(imagenes.length && /^(figura|tabla|grafico|gráfico|ilustraci\w+)\s*\d+([.:]|\s)/i.test(texto)){
    const bImg={id:bid,tipo:"imagen",estilo,texto:"",titulo:texto,imagenes};
    if(altText) bImg.alt_text=altText;
    const mn=/^figura\s*(\d+)/i.exec(texto);
    if(mn){ bImg.figura_numero=parseInt(mn[1],10); bImg.decorativa=false; }
    return [bImg];
  }
  // --- caso EdiLoja 2: imagen incrustada en un párrafo de texto normal (dentro de la
  // "Nota:", o imagen flotante decorativa junto al texto) → separar imagen + párrafo.
  // Excepción: iconos de focalizador (foc_*) se mantienen con su texto.
  const esIconoFoc = nombresImg.some(n=>/foc[_ ]/i.test(n));
  if(imagenes.length && texto && !esIconoFoc){
    const bImg={id:bid,tipo:"imagen",estilo,texto:"",imagenes};
    if(altText) bImg.alt_text=altText;
    const bTxt={id:bid,tipo:"parrafo",estilo,texto};
    if(negrita) bTxt.negrita=true;
    if(links.length) bTxt.hipervinculos=links;
    if(ecuaciones.length) bTxt.ecuaciones=ecuaciones;
    if(alineacion) bTxt.alineacion=alineacion;
    if(sangria) bTxt.sangria=sangria;
    const resto=[bImg,bTxt];
    for(const sa of smartarts)
      resto.push({id:bid,tipo:"smartart",origen:sa.origen,textos:sa.textos,
                  pendiente:"generar diagrama con IA a partir de los textos"});
    return resto;
  }
  // un párrafo corto con numeración manual multinivel y en negrita es un subtítulo
  const textoFinal = textoSinNum!=null ? textoSinNum : texto;
  if(nivel==null && numeracion!=null && textoSinNum!=null && (negrita || textoFinal.length<90)){
    const puntos=(numeracion.match(/\./g)||[]).length;
    nivel = Math.min(6, 1+puntos);   // 1.1. → H2, 1.1.1. → H3
  }
  const bloques=[];
  const tipo = nivel ? "encabezado" : esLista ? "lista"
             : (imagenes.length && !textoFinal) ? "imagen" : "parrafo";
  if(textoFinal || imagenes.length || ecuaciones.length){
    const b={id:bid,tipo,estilo,texto:textoFinal};
    if(nivel) b.nivel=nivel;
    if(numeracion) b.numeracion=numeracion;
    if(esLista){ b.nivel_lista=ilvl; b.lista_tipo=listaTipo||"ul"; }
    if(negrita) b.negrita=true;
    if(links.length) b.hipervinculos=links;
    if(ecuaciones.length) b.ecuaciones=ecuaciones;
    if(imagenes.length) b.imagenes=imagenes;
    if(nombresImg.length) b._docpr=nombresImg;
    if(alineacion) b.alineacion=alineacion;
    if(sangria) b.sangria=sangria;
    if(altText) b.alt_text=altText;
    if(imagenes.length && /descrip|caption|epigraf/i.test(estilo)) b._estiloCaption=true;
    bloques.push(b);
  }
  for(const sa of smartarts)
    bloques.push({id:bid,tipo:"smartart",origen:sa.origen,textos:sa.textos,
                  pendiente:"generar diagrama con IA a partir de los textos"});
  for(const tb of desc(p,W,"txbxContent")){
    const t=desc(tb,W,"p").map(wp=>textoDe(wp,false)).join("\n").trim();
    if(t) bloques.push({id:bid,tipo:"cuadro_texto",estilo,texto:t});
  }
  return bloques;
}
function leerTabla(tbl,bid){
  const filas=hijos(tbl,W,"tr");
  const celdas=filas.map(tr=>hijos(tr,W,"tc").map(tc=>
      hijos(tc,W,"p").map(p=>textoDe(p,false).trim()).filter(Boolean).join(" | ")));
  const nf=celdas.length, nc=celdas[0]?celdas[0].length:0;
  if(nf===1&&nc===1) return {id:bid,tipo:"caja",texto:celdas[0][0]};
  return {id:bid,tipo:"tabla",n_filas:nf,n_columnas:nc,celdas};
}
function extraerBloques(docXml, ctx){
  const body=desc(docXml,W,"body")[0];
  const bloques=[]; let bid=0;
  for(let n=body.firstChild;n;n=n.nextSibling){
    if(n.nodeType!==1) continue;
    bid++;
    if(n.localName==="p"&&n.namespaceURI===W) bloques.push(...leerParrafo(n,ctx,bid));
    else if(n.localName==="tbl"&&n.namespaceURI===W) bloques.push(leerTabla(n,bid));
  }
  return bloques;
}

/* ----------------------------- focalizadores (bloques destacados) */
const FOC_TIPOS = CONFIG.focalizadores;
const sinAcentos=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function subtipoFoc(nt){
  for(const [k,v] of FOC_TIPOS) if(nt.startsWith(k)) return v;
  return null;
}
function clasificarFocalizadores(bloques){
  for(const b of bloques){
    if((b.tipo==="parrafo"||b.tipo==="caja"||b.tipo==="encabezado")
       &&/^recursos?\s+ediloja/.test(norm(b.texto||""))){
      b.tipo="recurso_ediloja";
      b.pendiente="recurso por generar con agente de IA (EdiLoja)";
      continue;
    }
    if(b.tipo==="caja"){
      const s=subtipoFoc(norm(b.texto||""));
      if(s){ b.tipo="focalizador"; b.subtipo=s; b.icono="foc_"+sinAcentos(s)+".png"; }
    } else if(b._docpr){
      for(const n of b._docpr){
        const m=/foc[_ ](.+?)\.(png|jpe?g)/i.exec(n);
        if(m){
          const s=subtipoFoc(norm(m[1]))||m[1].trim();
          b.tipo="focalizador"; b.subtipo=s; b.icono="foc_"+sinAcentos(s)+".png"; break;
        }
      }
    }
    delete b._docpr;
  }
}

/* --- focalizadores delimitados por el revisor de DI:
       "Inicio focalizador video" ... "Fin focalizador video" --- */
function agruparFocDelimitados(bloques){
  const out=[]; let i=0;
  while(i<bloques.length){
    const b=bloques[i];
    const m=(b.tipo==="parrafo"||b.tipo==="encabezado")&&RX_FOC_INI.exec(norm(b.texto||""));
    if(m){
      // buscar el cierre en los siguientes 40 bloques
      let fin=-1;
      for(let j=i+1;j<Math.min(bloques.length,i+41);j++){
        const bj=bloques[j];
        if((bj.tipo==="parrafo"||bj.tipo==="encabezado")&&RX_FOC_FIN.test(norm(bj.texto||""))){fin=j;break;}
      }
      if(fin>i){
        const s=subtipoFoc(norm(m[1]))||m[1].trim();
        out.push({id:b.id,tipo:"focalizador",subtipo:s,icono:"foc_"+sinAcentos(s)+".png",
                  delimitado:true,bloques:bloques.slice(i+1,fin)});
        i=fin+1; continue;
      }
    }
    out.push(b); i++;
  }
  return out;
}

/* ------------------- agrupación: listas, tabla+título+nota, figuras */
const RX_MARCADOR = /^(semana\s*\d|unidad\s*\d|autoevaluaci|resultados?\s+de\s+apr|primer\s+bimestre|segundo\s+bimestre)/;
function agruparBloques(bloques){
  const RX_MANU_OL=/^(\d{1,2})[.)]\s+\S/;
  const RX_MANU_UL=/^[•\-–]\s+\S/;
  const RX_TIT_FIG=/^(figura|caso|grafico|gráfico|imagen|ilustraci\w+)\s*\d+([.:]|\s)/i;
  const RX_NOTA=/^(nota|fuente)\s*[.:]/i;
  const esCitaLinea=b=>b.tipo==="parrafo"&&!b.nivel&&((b.sangria||0)>=567||b.alineacion==="right"||b.alineacion==="end");
  const out=[];
  let i=0;
  while(i<bloques.length){
    const b=bloques[i];
    // --- CITA: párrafos consecutivos sangrados/alineados a la derecha que abren con comillas
    if(esCitaLinea(b)&&/^[“"«‘']/.test(b.texto||"")){
      const lineas=[b.texto]; let j=i+1;
      while(j<bloques.length&&esCitaLinea(bloques[j])){lineas.push(bloques[j].texto);j++;}
      let autor=null;
      if(lineas.length>1){
        const ult=lineas[lineas.length-1];
        if(ult.length<70&&!/^[“"«]/.test(ult)&&/\d{4}[.)”"]?$/.test(ult)){
          autor=ult; lineas.pop();
        }
      }
      out.push({id:b.id,tipo:"cita",texto:lineas.join(" ").replace(/\s+/g," ").trim(),
                ...(autor?{autor}:{}),lineas:lineas.length+(autor?1:0)});
      i=j; continue;
    }
    // --- listas automáticas de Word
    if(b.tipo==="lista" && !RX_MARCADOR.test(norm(b.texto||""))){
      const items=[];
      let j=i;
      while(j<bloques.length && bloques[j].tipo==="lista"
            && !RX_MARCADOR.test(norm(bloques[j].texto||""))){
        const it=bloques[j];
        items.push({texto:it.texto, nivel:it.nivel_lista||0,
                    tipo:it.lista_tipo||"ul", numeracion:it.numeracion||null,
                    ...(it.hipervinculos?{hipervinculos:it.hipervinculos}:{}),
                    ...(it.ecuaciones?{ecuaciones:it.ecuaciones}:{}),
                    ...(it.imagenes?{imagenes:it.imagenes}:{})});
        j++;
      }
      if(items.length>1){
        // si el párrafo anterior era un ítem numerado a mano (p. ej. "1. Ingrese a…"),
        // se incorpora como primer ítem de la lista
        const prev=out[out.length-1];
        if(prev&&prev.tipo==="parrafo"&&RX_MANU_OL.test(prev.texto||"")&&!RX_MARCADOR.test(norm(prev.texto||""))){
          items.unshift({texto:prev.texto,nivel:0,tipo:"ol",
                         numeracion:(RX_MANU_OL.exec(prev.texto)||[])[1]+".",
                         ...(prev.hipervinculos?{hipervinculos:prev.hipervinculos}:{}),
                         manual:true});
          out.pop();
        }
        out.push({id:b.id, tipo:"lista", ordenada: items[0].tipo==="ol", items});
        i=j; continue;
      }
    }
    // --- listas escritas a mano por el docente ("1. …" / "- …" tecleados)
    if(b.tipo==="parrafo"&&!b.nivel&&(RX_MANU_OL.test(b.texto||"")||RX_MANU_UL.test(b.texto||""))
       &&!RX_MARCADOR.test(norm(b.texto||""))){
      const items=[]; let j=i;
      while(j<bloques.length&&bloques[j].tipo==="parrafo"&&!bloques[j].nivel
            &&(RX_MANU_OL.test(bloques[j].texto||"")||RX_MANU_UL.test(bloques[j].texto||""))
            &&!RX_MARCADOR.test(norm(bloques[j].texto||""))){
        const it=bloques[j];
        const mo=RX_MANU_OL.exec(it.texto||"");
        items.push({texto:it.texto,nivel:0,tipo:mo?"ol":"ul",
                    numeracion:mo?mo[1]+".":null,manual:true,
                    ...(it.hipervinculos?{hipervinculos:it.hipervinculos}:{})});
        j++;
      }
      if(items.length>=2){
        out.push({id:b.id,tipo:"lista",ordenada:items[0].tipo==="ol",manual:true,items});
        i=j; continue;
      }
    }
    // --- título "Tabla N" (+ título) + tabla + "Nota./Fuente:" → una sección
    if((b.tipo==="tabla"||b.tipo==="caja") && out.length){
      const esTabLabel=x=>x&&x.tipo==="parrafo"&&/^tabla\s*$/i.test((x.texto||"").trim());
      const esTabNum=x=>x&&(x.tipo==="parrafo"||x.tipo==="encabezado")&&/^tabla\s*\d+[.:]?\s*$/i.test((x.texto||"").trim());
      const esTabNumTit=x=>x&&(x.tipo==="parrafo"||x.tipo==="encabezado")&&/^tabla\s*\d+[.:]/i.test(x.texto||"")&&(x.texto||"").length>11;
      const esCap=x=>x&&/descrip|caption|epigraf/i.test(x.estilo||"");
      if(esTabLabel(out[out.length-1])) out.pop();
      if(esTabNumTit(out[out.length-1])||(esCap(out[out.length-1])&&/^tabla/i.test(out[out.length-1].texto||""))){
        b.titulo=out.pop().texto;
      } else {
        const prev=out[out.length-1], prev2=out[out.length-2];
        if(esTabNum(prev2) && prev && prev.tipo==="parrafo" && (prev.texto||"").length>3 && !RX_NOTA.test(prev.texto||"")){
          b.titulo=(prev2.texto.replace(/[.:]\s*$/,"")+". "+prev.texto).trim(); out.pop(); out.pop();
        } else if(esTabNum(prev)){ b.titulo=prev.texto; out.pop(); }
      }
      let j=i+1, sig=bloques[j];
      if(esTabLabel(sig)){ j++; sig=bloques[j]; }
      if(sig && sig.tipo==="parrafo" && RX_NOTA.test(sig.texto||"")){
        b.nota=sig.texto; j++;
      }
      out.push(b); i=j; continue;
    }
    // --- figura como sección. Patrón EdiLoja observado:
    //   [Figura N]  [título de la figura]  [palabra "Figura"]  IMAGEN  [Nota. ...]
    // El título puede venir en 1 o 2 párrafos antes; "Figura" sola es etiqueta a descartar.
    if(b.tipo==="imagen"){
      // si la imagen ya trae su título (venía inline con el texto "Figura N ..."),
      // solo hay que capturar la Nota. posterior
      if(b.titulo){
        let j=i+1, sig=bloques[j];
        const esFigLbl=x=>x&&x.tipo==="parrafo"&&/^figura\s*$/i.test((x.texto||"").trim());
        if(esFigLbl(sig)){ j++; sig=bloques[j]; }
        if(sig && sig.tipo==="parrafo" && RX_NOTA.test(sig.texto||"")){ b.nota=sig.texto; j++; }
        if(b.figura_numero==null && !b.nota && !b._estiloCaption) b.decorativa=true;
        else if(b.decorativa==null) b.decorativa=false;
        delete b._estiloCaption;
        out.push(b); i=j; continue;
      }
      // recoger hacia atrás en out: etiqueta "Figura" suelta, luego título, luego "Figura N"
      let numero=null, tituloTxt=null;
      const esFigLabel=x=>x&&x.tipo==="parrafo"&&/^figura\s*$/i.test((x.texto||"").trim());
      const esFigNum=x=>x&&(x.tipo==="parrafo"||x.tipo==="encabezado")&&/^figura\s*\d+[.:]?\s*$/i.test((x.texto||"").trim());
      const esFigNumTit=x=>x&&(x.tipo==="parrafo"||x.tipo==="encabezado")&&RX_TIT_FIG.test(x.texto||"")&&(x.texto||"").length>12;
      // descartar la palabra "Figura" inmediatamente anterior a la imagen
      if(esFigLabel(out[out.length-1])) out.pop();
      // "Figura N." + título en el mismo párrafo
      if(esFigNumTit(out[out.length-1])){ tituloTxt=out.pop().texto; }
      else {
        // título suelto + "Figura N" en el párrafo anterior
        const prev=out[out.length-1], prev2=out[out.length-2];
        if(esFigNum(prev2) && prev && prev.tipo==="parrafo" && (prev.texto||"").length>3
           && !RX_NOTA.test(prev.texto||"")){
          tituloTxt=(prev2.texto.replace(/[.:]\s*$/,"")+". "+prev.texto).trim();
          out.pop(); out.pop();
        } else if(esFigNum(prev)){
          tituloTxt=prev.texto; out.pop();
        }
      }
      if(tituloTxt){
        const mn=/^figura\s*(\d+)/i.exec(tituloTxt);
        if(mn) numero=parseInt(mn[1],10);
        b.titulo=tituloTxt;
      }
      // hacia adelante: saltar "Figura" suelta, capturar "Nota."
      let j=i+1, sig=bloques[j];
      if(esFigLabel(sig)){ j++; sig=bloques[j]; }
      if(sig && sig.tipo==="parrafo" && RX_NOTA.test(sig.texto||"")){
        b.nota=sig.texto; j++;
      }
      // clasificar decorativa vs. de contenido
      if(numero!=null){
        b.figura_numero=numero; b.decorativa=false;
      } else if(!b.titulo && !b.nota && !b._estiloCaption){
        b.decorativa=true;   // sin numeración, título ni nota → decorativa
      } else {
        b.decorativa=false;
      }
      delete b._estiloCaption;
      out.push(b); i=j; continue;
    }
    out.push(b); i++;
  }
  return out;
}
function asignarFiguras(bloques){
  const mapa=new Map();   // ruta interna → nombre FiguraN.ext
  const lista=[];
  const nombreDe=target=>{
    if(mapa.has(target)) return mapa.get(target);
    const ext=(target.split(".").pop()||"png").toLowerCase();
    const nombre=`Figura${mapa.size+1}.${ext}`;
    mapa.set(target,nombre);
    lista.push({nombre, ruta_zip: target.startsWith("media/")?"word/"+target:
                        (target.startsWith("word/")?target:"word/"+target.replace(/^\.\.\//,""))});
    return nombre;
  };
  const proc=b=>{
    if(b.imagenes) b.imagenes=b.imagenes.map(t=>({archivo:"Imagenes/"+nombreDe(t), origen:t}));
    if(b.items) for(const it of b.items)
      if(it.imagenes) it.imagenes=it.imagenes.map(t=>({archivo:"Imagenes/"+nombreDe(t), origen:t}));
    if(b.bloques) b.bloques.forEach(proc);
  };
  bloques.forEach(proc);
  return lista;
}

/* --------------------------------------- portada e info_general */
function infoGeneral(bloques, nombreArchivo){
  const codigo=nombreArchivo.split("_").slice(0,2).join("_");
  const info={codigo_banner:codigo, archivo_origen:nombreArchivo,
              facultad:null, departamento:null, asignatura:null,
              carrera:null, nivel:null, autor:null};
  const texDe=b=> b.texto!=null ? b.texto : (b.items&&b.items.length===1?b.items[0].texto:"");
  const cab=bloques.slice(0,14);
  for(let i=0;i<cab.length;i++){
    const b=cab[i], t=texDe(b)||"", nt=norm(t);
    if(b.tipo==="tabla"&&b.n_filas===2&&b.n_columnas===2){
      const fila=b.celdas[1]||[];
      info.carrera=fila[0]||null; info.nivel=fila[1]||null;
    } else if(nt.startsWith("facultad")&&t.length<90&&!t.includes("…")&&!info.facultad){
      info.facultad=t;
    } else if(nt.startsWith("departamento")&&t.length<90){
      info.departamento=t;
    } else if(nt==="guia didactica"&&i>0){
      const prev=texDe(cab[i-1])||"", np=norm(prev);
      if(prev&&!np.startsWith("facultad")&&!np.startsWith("departamento")) info.asignatura=prev;
    } else if(nt==="autor:"&&i+1<cab.length){
      info.autor=texDe(cab[i+1])||null;
    }
  }
  const mapa=[["codigo_banner","banner.asignatura.codigo"],["asignatura","banner.asignatura.nombre"],
              ["carrera","banner.carrera.nombre"],["nivel","banner.malla.nivel"],
              ["facultad","banner.facultad.nombre"],["autor","rrhh.docente.nombre_completo"]];
  info.cotejo_bd=mapa.map(([c,v])=>({campo:c,valor:info[c],
      fuente:c==="codigo_banner"?"nombre_archivo":"portada_documento",
      verificar_contra:v, estado:info[c]?"pendiente":"faltante_en_documento"}));
  return info;
}

/* ----------------------------------------- construcción del curso */
const _RX = k => new RegExp(CONFIG.marcadores[k]);
const RX_SEM=_RX("semana"), RX_RA=_RX("resultado"), RX_UNI=_RX("unidad"),
      RX_AUTO=_RX("autoevaluacion"), RX_BIM=_RX("bimestre"),
      RX_ACTR=_RX("actividades_recomendadas"), RX_ACTE=_RX("actividades_evaluadas"),
      RX_ACT_ITEM=/^actividad\s+(recomendada|evaluada)\s*\d+\s*[:.\-]/i,
      RX_ACT_SECC=/^actividades\s+(de\s+aprendizaje\s+)?(recomendad|evaluad)/i,
      RX_FOC_INI=_RX("focalizador_inicio"), RX_FOC_FIN=_RX("focalizador_fin");
const esMarcaGD = b => (b.estilo||"").startsWith(CONFIG.estilos_marca_prefijo);

function esAncla(b, frases, tol){
  if(b.tipo!=="encabezado"&&b.tipo!=="parrafo") return false;
  if((b.estilo||"").startsWith("toc")) return false;
  const marca=b.nivel===1||b.negrita||b.estilo==="Title"||esMarcaGD(b);
  return marca&&fuzzy(norm(b.texto||""),frases,tol==null?CONFIG.tolerancia_difusa:tol);
}

function construirCurso(bloques, nombreArchivo, extras){
  extras=extras||{};
  const info=infoGeneral(bloques,nombreArchivo);
  const nb=bloques.length;

  const ANCLAS = Object.entries(CONFIG.anclas);
  const FINALES=new Set(["referencias","solucionario","glosario","anexos"]);
  const anclas={};
  bloques.forEach((b,i)=>{
    if((b.estilo||"").startsWith("toc")) return;
    const nt=norm(b.texto||"");
    for(const [clave,frases] of ANCLAS){
      if(clave in anclas) continue;
      if(FINALES.has(clave)&&i<nb*0.5) continue;
      if(esAncla(b,frases)) anclas[clave]=i;
      else if(clave==="solucionario"&&nt.startsWith("solucionario")
              &&(b.texto||"").length<60&&(b.tipo==="parrafo"||b.tipo==="encabezado"))
        anclas[clave]=i;
    }
  });
  const ini=anclas.datos!=null?anclas.datos:0;
  const finCand=["referencias","solucionario","glosario","anexos"]
      .filter(k=>anclas[k]!=null).map(k=>anclas[k]);
  const finCuerpo=finCand.length?Math.min(...finCand):nb;
  const rebanar=(a,b)=>bloques.slice(a,b).filter(x=>!(x.estilo||"").startsWith("toc"));

  const datosFin=anclas.metodologia!=null?anclas.metodologia:ini;
  const SUB = Object.entries(CONFIG.subsecciones_datos);
  const datos={titulo:"1. DATOS DE INFORMACIÓN",subsecciones:[],bloques:[]};
  let curSub=null;
  for(const b of rebanar(ini+1,datosFin)){
    let es=false;
    for(const [clave,frases] of SUB)
      if((b.tipo==="encabezado"||b.negrita)&&fuzzy(norm(b.texto||""),frases)){
        curSub={clave,titulo:b.texto,bloques:[]}; datos.subsecciones.push(curSub); es=true; break;
      }
    if(!es) (curSub?curSub.bloques:datos.bloques).push(b);
  }
  const metodologia={titulo:"2. METODOLOGÍA DE APRENDIZAJE",
      bloques:rebanar((anclas.metodologia!=null?anclas.metodologia:ini)+1,
                      anclas.orientaciones!=null?anclas.orientaciones:datosFin)};

  const paginas=[], unidades={}, resultados=[], bimestres=[], preambulo=[];
  let curBim=null,curRa=null,curUni=null,pagina=null,lastWeek=0,raAuto=0,autoAbierta=null,ctxRA=false;
  let actAbierta=null, actRec=0, actEval=0;
  const actividadesMalUbicadas=[];
  const cerrarAuto=()=>{autoAbierta=null;};
  const cerrarPag=()=>{cerrarAuto(); ctxRA=false;
    if(actAbierta) delete actAbierta._itemActual;
    actAbierta=null; if(pagina){paginas.push(pagina);pagina=null;}};

  for(const b of rebanar((anclas.orientaciones!=null?anclas.orientaciones:ini)+1,finCuerpo)){
    const t=b.texto||"", nt=norm(t);
    const marca=b.tipo==="encabezado"||b.negrita||esMarcaGD(b);
    const conf = (b.tipo==="encabezado"||esMarcaGD(b)) ? "alta" : (b.negrita?"media":"baja");
    let m;
    if((m=RX_BIM.exec(nt))&&marca){
      cerrarPag(); curBim=t.trim();
      if(!bimestres.includes(curBim)) bimestres.push(curBim);
      continue;
    }
    if((m=RX_RA.exec(nt))&&marca){
      const numRA=m[1]||String(raAuto+1);
      if(curRa&&curRa.numero===numRA&&curRa.semanas.length===0) continue;  // "Resultado de aprendizaje N." repetido bajo el H1
      cerrarPag(); raAuto++;
      curRa={numero:m[1]||String(raAuto),enunciado:null,contextualizacion:null,
             contextualizacion_fuente:null,bimestre:curBim,semanas:[]};
      resultados.push(curRa); continue;
    }
    if(curRa&&curRa.enunciado==null&&b.tipo==="parrafo"&&t.length>25
       &&!RX_SEM.test(nt)&&!nt.slice(0,12).includes("contenidos"))
      curRa.enunciado=t;
    // contextualización del RA: encabezado "Contextualización" + párrafos siguientes
    if(curRa&&!pagina&&nt.startsWith("contextualizaci")&&marca&&t.length<40){
      ctxRA=true; curRa.contextualizacion_fuente="encabezado"; continue;
    }
    if(ctxRA&&curRa){
      if((b.tipo==="parrafo"||b.tipo==="lista")&&!nt.slice(0,12).includes("contenidos")
         &&!RX_SEM.test(nt)&&!RX_UNI.test(nt)){
        const tx=b.texto||(b.items?b.items.map(i=>i.texto).join(" "):"");
        curRa.contextualizacion=(curRa.contextualizacion?curRa.contextualizacion+"\n":"")+tx;
        continue;
      }
      ctxRA=false;   // cualquier encabezado u otro marcador cierra la contextualización
    }
    // contextualización IMPLÍCITA: párrafos que siguen al enunciado del RA,
    // antes de cualquier encabezado o semana (técnica para guías sin el encabezado)
    if(b.tipo==="encabezado"&&curRa&&!pagina) curRa._ctxCerrada=true;
    if(curRa&&!pagina&&!ctxRA&&curRa.contextualizacion_fuente!=="encabezado"
       &&!curRa._ctxCerrada&&curRa.enunciado&&b.tipo==="parrafo"
       &&t!==curRa.enunciado&&t.length>60&&(curRa._ctxN||0)<4){
      curRa.contextualizacion=(curRa.contextualizacion?curRa.contextualizacion+"\n":"")+t;
      curRa.contextualizacion_fuente="implicita";
      curRa._ctxN=(curRa._ctxN||0)+1;
      continue;
    }
    if((m=RX_SEM.exec(nt))&&marca){
      const n=parseInt(m[1],10);
      if(n<=lastWeek&&lastWeek>=6) continue;
      cerrarPag(); lastWeek=n;
      pagina={tipo:"pagina",semana:n,titulo:"Semana "+n,bimestre:curBim,
              resultado_aprendizaje:curRa?curRa.numero:null,unidad:curUni,
              confianza:conf,bloques:[]};
      if(curRa) curRa.semanas.push(n);
      continue;
    }
    if((m=RX_UNI.exec(nt))&&marca){
      const nu=parseInt(m[1],10);
      actAbierta=null;
      if(!unidades[nu]) unidades[nu]={numero:nu,titulo:t.trim(),semanas:[],autoevaluaciones:[]};
      if(t.trim().length>(unidades[nu].titulo||"").length) unidades[nu].titulo=t.trim();
      curUni=nu;
      // v2.1: el título de la unidad forma parte del contenido de la página, como en el Word
      const bloqueUni={...b, rol:"titulo_unidad", unidad:nu};
      if(pagina){
        pagina.unidad=nu;
        if(!unidades[nu].semanas.includes(pagina.semana)) unidades[nu].semanas.push(pagina.semana);
        pagina.bloques.push(bloqueUni);
      } else preambulo.push(bloqueUni);
      continue;
    }
    if((m=RX_AUTO.exec(nt))&&(marca||t.length<45)){
      cerrarAuto(); actAbierta=null;
      const total=Object.values(unidades).reduce((s,u)=>s+u.autoevaluaciones.length,0);
      const uniLibre = curUni && unidades[curUni] && unidades[curUni].autoevaluaciones.length===0;
      const nA=numDe(t)||(uniLibre?curUni:total+1);
      autoAbierta={numero:nA,titulo:t.trim(),unidad:curUni,confianza:conf,
                   semana_en_que_aparece:pagina?pagina.semana:null,
                   bloques:[],solucionario:{encontrado:false,bloques:[]}};
      const key=curUni||0;
      if(!unidades[key]) unidades[key]={numero:key,titulo:null,semanas:[],autoevaluaciones:[]};
      unidades[key].autoevaluaciones.push(autoAbierta);
      if(pagina) pagina.bloques.push({tipo:"autoevaluacion_ref",numero:nA,titulo:t.trim(),unidad:curUni});
      continue;
    }
    // encabezado de SECCIÓN de actividades ("Actividades de aprendizaje recomendadas/evaluadas")
    if((marca||RX_ACT_SECC.test(t)) && t.length<80 && RX_ACT_SECC.test(t)){
      cerrarAuto();
      const clase=/evaluad/i.test(t)?"evaluadas":"recomendadas";
      if(clase==="evaluadas") actEval++; else actRec++;
      actAbierta={tipo:"actividades",clase,titulo:t.trim(),items:[],bloques:[]};
      (pagina?pagina.bloques:preambulo).push(actAbierta);
      continue;
    }
    // "Actividad recomendada N:" = item de actividad. Abre la sección si no hay una.
    if(RX_ACT_ITEM.test(t)){
      const clase=/evaluad/i.test(t)?"evaluadas":"recomendadas";
      if(!actAbierta || actAbierta.clase!==clase){
        if(clase==="evaluadas") actEval++; else actRec++;
        actAbierta={tipo:"actividades",clase,titulo:clase==="evaluadas"?"Actividades evaluadas":"Actividades de aprendizaje recomendadas",
                    items:[],bloques:[],_implicita:true};
        (pagina?pagina.bloques:preambulo).push(actAbierta);
      }
      const itemAct={titulo:t.trim(),bloques:[]};
      actAbierta.items.push(itemAct);
      actAbierta._itemActual=itemAct;
      continue;
    }
    if(actAbierta){
      // cierra la sección: marcador estructural, encabezado H1-2, o un TEMA numerado
      // ("1.3.4. Litósfera") — eso es material del texto, no actividad
      const esTema = b.tipo==="encabezado" && b.numeracion && /\d+\.\d+/.test(b.numeracion);
      const esCierre = RX_SEM.test(nt)||RX_UNI.test(nt)||RX_RA.test(nt)||RX_AUTO.test(nt)
                     ||RX_BIM.test(nt)||(b.tipo==="encabezado"&&b.nivel&&b.nivel<=2)||esTema;
      if(!esCierre){
        (actAbierta._itemActual?actAbierta._itemActual.bloques:actAbierta.bloques).push(b);
        continue;
      }
      if(esTema && pagina && !actividadesMalUbicadas.includes(pagina.semana))
        actividadesMalUbicadas.push(pagina.semana);
      delete actAbierta._itemActual;
      actAbierta=null;
    }
    if(autoAbierta){autoAbierta.bloques.push(b);continue;}
    if(pagina) pagina.bloques.push(b); else preambulo.push(b);
  }
  cerrarPag();

  const ordenFin=Object.entries(anclas).filter(([k])=>FINALES.has(k))
      .map(([k,v])=>[v,k]).sort((a,b)=>a[0]-b[0]);
  const finales={};
  ordenFin.forEach(([pos,clave],idx)=>{
    const hasta=idx+1<ordenFin.length?ordenFin[idx+1][0]:nb;
    finales[clave]={titulo:bloques[pos].texto,bloques:rebanar(pos+1,hasta)};
  });

  // cotejo autoevaluación ↔ solucionario (4 formatos; las listas agrupadas
  // se recorren ítem por ítem para no perder entradas)
  const solBloques=(finales.solucionario||{}).bloques||[];
  const sol=[];
  for(const b of solBloques){
    if(b.tipo==="lista"&&b.items) for(const it of b.items)
      sol.push({tipo:"lista",texto:it.texto,items:null,_item:true});
    else sol.push(b);
  }
  const RX_ENT=/^(autoevaluaci\w+|solucionario)\s*[:.]?\s*(.*)$/;
  const RX_ESEM=/^semana\s*(\d{1,2})\s*[:.\-]?/;
  const entradas=new Map(); let curE=null;
  const clave=(tipo,n)=>tipo+":"+n;
  for(const b of sol){
    const t=b.tipo!=="tabla"?(b.texto||""):"";
    const nt=norm(t);
    if(b.tipo==="tabla"){
      const c0=norm((b.celdas[0]&&b.celdas[0][0])||"");
      const n=RX_ENT.test(c0)?numDe(c0):null;
      if(n){const k=clave("n",n);
            if(!entradas.has(k))entradas.set(k,[]);
            entradas.get(k).push(b);curE=entradas.get(k);}
      else if(curE)curE.push(b);
      continue;
    }
    let m=RX_ESEM.exec(nt);
    if(m&&t.length<40){
      const k=clave("sem",parseInt(m[1],10));
      if(!entradas.has(k))entradas.set(k,[]);
      curE=entradas.get(k);continue;
    }
    m=RX_ENT.exec(nt);
    if(m&&t.length<130){
      let n=numDe(t);
      if(n||m[1].startsWith("autoevaluaci")){
        if(!n){let mx=0;for(const k of entradas.keys())
                if(k.startsWith("n:"))mx=Math.max(mx,parseInt(k.slice(2),10));
              n=mx+1;}
        const k=clave("n",n);
        if(!entradas.has(k))entradas.set(k,[]);
        curE=entradas.get(k);continue;
      }
    }
    if(curE)curE.push(b);
  }
  const todasAuto=Object.values(unidades).flatMap(u=>u.autoevaluaciones);
  if(entradas.size===0&&sol.length&&todasAuto.length===1)
    entradas.set(clave("n",todasAuto[0].numero),sol);
  const usadas=new Set();
  for(const a of todasAuto){
    const kN=clave("n",a.numero), kS=clave("sem",a.semana_en_que_aparece);
    const eN=entradas.get(kN), eS=entradas.get(kS);
    const e=eN||eS;
    if(e&&e.length){
      a.solucionario={encontrado:true,cotejado_por:eN?"numero":"semana",confianza:"alta",bloques:e};
      usadas.add(eN?kN:kS);
    }
  }
  // reparación segura: si sobran exactamente tantas entradas como autoevaluaciones
  // sin cotejar, se vinculan POR ORDEN con confianza media
  const sinMatch=todasAuto.filter(a=>!a.solucionario.encontrado);
  const libres=[...entradas.entries()].filter(([k,v])=>!usadas.has(k)&&v.length);
  if(sinMatch.length && sinMatch.length===libres.length){
    sinMatch.forEach((a,i)=>{
      a.solucionario={encontrado:true,cotejado_por:"orden",confianza:"media",bloques:libres[i][1]};
    });
  }

  // validaciones
  const semanasDet=paginas.map(p=>p.semana).sort((a,b)=>a-b);
  const esperadas=semanasDet.length&&Math.max(...semanasDet)>8?16:8;
  const sinSol=todasAuto.filter(a=>!a.solucionario.encontrado).map(a=>a.numero);
  const nums=todasAuto.map(a=>a.numero);
  const dup=[...new Set(nums.filter(n=>nums.filter(x=>x===n).length>1))].sort((a,b)=>a-b);
  const alertas=[];
  if(dup.length) alertas.push("Numeración de autoevaluaciones duplicada por el docente: ["+dup.join(", ")+"]");
  const faltan=[];for(let n=1;n<=esperadas;n++)if(!semanasDet.includes(n))faltan.push(n);
  if(faltan.length) alertas.push("Semanas no detectadas: ["+faltan.join(", ")+"]");
  if(sinSol.length) alertas.push("Autoevaluaciones sin entrada en el solucionario: ["+sinSol.join(", ")+"]");
  for(const c of info.cotejo_bd)
    if(c.estado==="faltante_en_documento")
      alertas.push("Campo de portada no encontrado en el documento: "+c.campo);
  const nEcu=bloques.reduce((s,b)=>s+(b.ecuaciones?b.ecuaciones.length:0),0);
  const nCtx=bloques.filter(b=>b.tipo==="cuadro_texto").length;
  const nSmart=bloques.filter(b=>b.tipo==="smartart").length;
  if(nEcu) alertas.push(nEcu+" ecuaciones OMML requieren conversión a LaTeX/MathML");
  if(nCtx) alertas.push(nCtx+" cuadros de texto rescatados del XML (invisibles en extracción simple)");
  if(nSmart) alertas.push(nSmart+" diagramas SmartArt: texto capturado; el diagrama debe generarse con IA en una etapa posterior");
  const nRec=bloques.filter(b=>b.tipo==="recurso_ediloja").length;
  if(nRec) alertas.push(nRec+" RECURSO(S) EDILOJA marcados: los generará otro agente de IA en una etapa posterior");
  // figuras de contenido (numeradas) sin título completo, y accesibilidad (alt text)
  const figsSinTit=[], figsSinAlt=[];
  const todosBloques=b=>{const r=[];const walk=x=>{r.push(x);(x.bloques||[]).forEach(walk);(x.items||[]).forEach(()=>{});};b.forEach(walk);return r;};
  for(const pg of paginas) for(const bb of todosBloques(pg.bloques)){
    if(bb.tipo!=="imagen"||bb.decorativa) continue;
    const nom=(bb.imagenes&&bb.imagenes[0]?bb.imagenes[0].archivo.split("/").pop():"imagen")+" (S"+pg.semana+")";
    if(!bb.titulo) figsSinTit.push(nom);
    if(!bb.alt_text) figsSinAlt.push(nom);
  }
  if(figsSinTit.length)
    alertas.push("Figuras de contenido sin título \"Figura N. …\": "+figsSinTit.slice(0,8).join(", ")+(figsSinTit.length>8?" y "+(figsSinTit.length-8)+" más":""));
  // tablas sin el formato "Tabla N." arriba + "Nota." abajo
  const tabsMal=[];
  for(const pg of paginas) for(const bb of todosBloques(pg.bloques))
    if(bb.tipo==="tabla"&&(!bb.titulo||!bb.nota))
      tabsMal.push("Semana "+pg.semana+(bb.titulo?"":" (sin título)")+(bb.nota?"":" (sin Nota)"));
  if(tabsMal.length)
    alertas.push("Tablas sin el formato completo (título \"Tabla N.\" arriba y \"Nota.\" abajo): "+tabsMal.slice(0,6).join(", ")+(tabsMal.length>6?" y "+(tabsMal.length-6)+" más":"")+" — REVISOR: complete el título o la nota/fuente en el Word");
  // figuras de contenido sin nota/fuente
  const figsSinNota=[];
  for(const pg of paginas) for(const bb of todosBloques(pg.bloques))
    if(bb.tipo==="imagen"&&!bb.decorativa&&bb.titulo&&!bb.nota)
      figsSinNota.push((bb.imagenes&&bb.imagenes[0]?bb.imagenes[0].archivo.split("/").pop():"imagen")+" (S"+pg.semana+")");
  if(figsSinNota.length)
    alertas.push("Figuras de contenido sin \"Nota.\" o \"Fuente:\" debajo: "+figsSinNota.slice(0,6).join(", ")+(figsSinNota.length>6?" y más":"")+" — REVISOR: añada la fuente o marque la figura como decorativa");
  // viñetas sueltas con símbolos no estándar (no se agrupan): el revisor las convierte
  const vinSueltas=bloques.filter(b=>b.tipo==="lista"&&!b.items).length;
  if(vinSueltas)
    alertas.push(vinSueltas+" viñeta(s) sueltas de un solo elemento (símbolos no estándar como ➔): REVISOR: conviértalas en listas estándar de Word para que se agrupen");
  if(actividadesMalUbicadas.length)
    alertas.push("Actividades de aprendizaje a MITAD de la semana en ["+actividadesMalUbicadas.join(", ")+"] seguidas de contenido temático: REVISOR: mueva las actividades recomendadas al FINAL de la semana");
  if(figsSinAlt.length)
    alertas.push("Accesibilidad Canvas: "+figsSinAlt.length+" figura(s) numerada(s) sin texto alternativo — "+figsSinAlt.slice(0,6).join(", ")+(figsSinAlt.length>6?" y más":"")+". Toda figura no decorativa debe tener texto alternativo (Word: clic derecho en la imagen → Ver texto alternativo)");
  // numeración automática de encabezados con reinicios dentro de la misma semana
  const semNumMal=[];
  for(const pg of paginas){
    let prevNum=null;
    for(const bb of pg.bloques){
      if(bb.tipo==="encabezado"&&bb.numeracion){
        const mn=/^(\d+)/.exec(bb.numeracion);
        if(mn){const v=parseInt(mn[1],10);
          if(prevNum!=null&&v<prevNum&&!semNumMal.includes(pg.semana)) semNumMal.push(pg.semana);
          prevNum=v;}
      }
    }
  }
  if(semNumMal.length)
    alertas.push("Numeración automática de encabezados con reinicios o saltos en semanas ["+semNumMal.join(", ")+"]: se conserva tal como la generó el docente; revísela en el Word etiquetado");
  const uniReales=Object.values(unidades).filter(u=>u.numero);
  const uniSinAuto=uniReales.filter(u=>u.autoevaluaciones.length===0).map(u=>u.numero);
  const uniMulti=uniReales.filter(u=>u.autoevaluaciones.length>1).map(u=>u.numero);
  const huerfanas=unidades[0]?unidades[0].autoevaluaciones.length:0;
  if(uniSinAuto.length) alertas.push("Unidades sin autoevaluación ["+uniSinAuto.join(", ")+"]: la generará el agente de IA (debe existir exactamente una por unidad)");
  if(uniMulti.length) alertas.push("Unidades con más de una autoevaluación ["+uniMulti.join(", ")+"]: el curso exige exactamente una por unidad; deje solo una en el Word");
  if(huerfanas) alertas.push(huerfanas+" autoevaluación(es) sin unidad declarada: escriba el encabezado \"Unidad N. Título\" antes de cada autoevaluación");
  resultados.forEach(r=>{delete r._ctxN; delete r._ctxCerrada;});
  const ctxImpl=resultados.filter(r=>r.contextualizacion_fuente==="implicita").map(r=>r.numero);
  if(ctxImpl.length) alertas.push("Contextualización detectada sin encabezado en RA ["+ctxImpl.join(", ")+"] (confianza media): confirme el texto o use el encabezado \"Contextualización\" en el Word");
  // cada RA debe conducir a "Contenidos, recursos y actividades de aprendizaje recomendadas"
  const RX_CRA=/contenidos,?\s+recursos\s+y\s+actividades\s+de\s+aprendizaje\s+recomendad/;
  const hayCRA=bloques.some(b=>RX_CRA.test(norm(b.texto||"")));
  if(resultados.length && !hayCRA)
    alertas.push("No se encontró el encabezado de cierre \"Contenidos, recursos y actividades de aprendizaje recomendadas\": cada recurso de aprendizaje debe terminar con esa frase exacta");
  const sinCtx=resultados.filter(r=>!r.contextualizacion).map(r=>r.numero);
  if(sinCtx.length) alertas.push("Resultados de aprendizaje sin contextualización ["+sinCtx.join(", ")+"]: la generará el agente de IA en una etapa posterior");

  return {
    version:"2.1", generado:new Date().toISOString().slice(0,10),
    info_general:info,
    estadisticas:{
      bloques_totales:nb, paginas_semana:paginas.length,
      unidades:Object.values(unidades).filter(u=>u.numero).length,
      resultados_aprendizaje:resultados.length,
      autoevaluaciones:todasAuto.length,
      autoevaluaciones_con_solucionario:todasAuto.length-sinSol.length,
      tablas:bloques.filter(b=>b.tipo==="tabla").length,
      cajas_destacadas:bloques.filter(b=>b.tipo==="caja").length,
      focalizadores:bloques.filter(b=>b.tipo==="focalizador").length,
      citas:bloques.filter(b=>b.tipo==="cita").length,
      recursos_ediloja:bloques.filter(b=>b.tipo==="recurso_ediloja").length,
      actividades_recomendadas:actRec, actividades_evaluadas:actEval,
      listas:bloques.filter(b=>b.tipo==="lista"&&b.items).length,
      imagenes:extras.figuras!=null?extras.figuras:0,
      figuras_decorativas:bloques.filter(b=>b.tipo==="imagen"&&b.decorativa).length,
      figuras_sin_alt:bloques.filter(b=>b.tipo==="imagen"&&!b.decorativa&&!b.alt_text).length,
      smartart:nSmart,
      hipervinculos:bloques.reduce((s,b)=>s+(b.hipervinculos?b.hipervinculos.length:0),0),
      ecuaciones_omml:nEcu, cuadros_texto:nCtx,
    },
    secciones:{datos_informacion:datos,metodologia},
    estructura:{
      titulo:"3. ORIENTACIONES DIDÁCTICAS POR RESULTADOS DE APRENDIZAJE",
      bimestres, resultados_aprendizaje:resultados,
      unidades:Object.keys(unidades).map(Number).sort((a,b)=>a-b).filter(k=>k).map(k=>unidades[k]),
      preambulo_bloques:preambulo, paginas,
    },
    finales,
    validaciones:{semanas_esperadas:esperadas,semanas_detectadas:semanasDet,
                  secuencia_completa:faltan.length===0,alertas},
  };
}

/* --------- Word etiquetado: mapa id→estilo GD y generación del .docx --------- */
const GD_DEFS=[
  ["GD-SeccionMacro",0,"1F4E79"],["GD-Bimestre",0,"7030A0"],
  ["GD-ResultadoAprendizaje",0,"C00000"],["GD-Contextualizacion",1,"C55A11"],
  ["GD-Semana",1,"0070C0"],["GD-Unidad",1,"00838F"],["GD-Autoevaluacion",2,"2E7D32"],
  ["GD-ActividadesRecomendadas",2,"BF5E0E"],["GD-ActividadesEvaluadas",2,"0B874B"]];
function mapaEstilosGD(bloques){
  const nb=bloques.length, mapa={}, anclasVistas=new Set();
  const FIN=new Set(["referencias","solucionario","glosario","anexos"]);
  let corte=nb;
  bloques.forEach((b,i)=>{
    if(i<nb*0.5||corte<nb) return;
    if((b.estilo||"").startsWith("toc")) return;
    const t=b.texto||""; if(!t||t.length>90) return;
    const nt=norm(t);
    for(const k of FIN){
      let es=esAncla(b,CONFIG.anclas[k]);
      if(!es&&k==="solucionario"&&nt.startsWith("solucionario")&&t.length<60&&
         (b.tipo==="parrafo"||b.tipo==="encabezado")) es=true;
      if(es){corte=i;break;}
    }
  });
  let lastWeek=0;
  bloques.forEach((b,i)=>{
    if((b.estilo||"").startsWith("toc")||(b.estilo||"").startsWith("GD-")) return;
    const t=(b.texto||"").trim(); if(!t||t.length>140) return;
    const nt=norm(t);
    const marca=b.tipo==="encabezado"||b.negrita;
    for(const [k,frases] of Object.entries(CONFIG.anclas)){
      if(anclasVistas.has(k)) continue;
      if(FIN.has(k)&&i<nb*0.5) continue;
      let es=marca&&fuzzy(nt,frases,CONFIG.tolerancia_difusa);
      if(!es&&k==="solucionario"&&nt.startsWith("solucionario")&&t.length<60) es=true;
      if(es){anclasVistas.add(k);mapa[b.id]="GD-SeccionMacro";return;}
    }
    if(i>=corte) return;
    let m;
    if(marca){
      if(RX_BIM.test(nt)){mapa[b.id]="GD-Bimestre";return;}
      if(RX_RA.test(nt)){mapa[b.id]="GD-ResultadoAprendizaje";return;}
      if(nt.startsWith("contextualizaci")&&t.length<40){mapa[b.id]="GD-Contextualizacion";return;}
      if((m=RX_SEM.exec(nt))){
        const n=parseInt(m[1],10);
        if(!(n<=lastWeek&&lastWeek>=6)){lastWeek=n;mapa[b.id]="GD-Semana";}
        return;
      }
      if(RX_UNI.test(nt)){mapa[b.id]="GD-Unidad";return;}
      if(t.length<80&&RX_ACTE.test(nt)){mapa[b.id]="GD-ActividadesEvaluadas";return;}
      if(t.length<80&&RX_ACTR.test(nt)){mapa[b.id]="GD-ActividadesRecomendadas";return;}
    }
    if(RX_AUTO.test(nt)&&(marca||t.length<45)) mapa[b.id]="GD-Autoevaluacion";
  });
  return mapa;
}
async function generarDocxEtiquetado(arrayBuffer, JSZipImpl, DOMParserImpl, XMLSerializerImpl){
  const zip=await JSZipImpl.loadAsync(arrayBuffer);
  const leer=async n=>{const f=zip.file(n);if(!f)return null;
    return (await f.async("string")).replace(/^\uFEFF/,"");};
  const [docS,relsS,stylesS,numS]=await Promise.all([
    leer("word/document.xml"),leer("word/_rels/document.xml.rels"),
    leer("word/styles.xml"),leer("word/numbering.xml")]);
  const P=new DOMParserImpl();
  const docXml=P.parseFromString(docS,"text/xml");
  const rels=mapaRels(relsS?P.parseFromString(relsS,"text/xml"):null);
  const estilos=mapaEstilos(stylesS?P.parseFromString(stylesS,"text/xml"):null);
  const contador=crearContador(mapaNumeracion(numS?P.parseFromString(numS,"text/xml"):null));
  let bloques=extraerBloques(docXml,{estilos,rels,contador,diagramas:{}});
  bloques=agruparBloques(bloques);
  const mapa=mapaEstilosGD(bloques);
  // aplicar pStyle a los párrafos marcados (recorrido idéntico al del extractor: bid)
  const body=desc(docXml,W,"body")[0];
  let bid=0, aplicados=0;
  for(let n=body.firstChild;n;n=n.nextSibling){
    if(n.nodeType!==1) continue;
    bid++;
    if(!(n.localName==="p"&&n.namespaceURI===W)) continue;
    const gd=mapa[bid]; if(!gd) continue;
    let ppr=hijos(n,W,"pPr")[0];
    if(!ppr){ppr=docXml.createElementNS(W,"w:pPr");n.insertBefore(ppr,n.firstChild);}
    let ps=hijos(ppr,W,"pStyle")[0];
    if(!ps){ps=docXml.createElementNS(W,"w:pStyle");ppr.insertBefore(ps,ppr.firstChild);}
    ps.setAttributeNS(W,"w:val",gd);
    aplicados++;
  }
  const nuevoDoc=new XMLSerializerImpl().serializeToString(docXml);
  // inyectar definiciones de estilos GD- si no existen
  let nuevosEstilos=stylesS;
  const defs=GD_DEFS.filter(([nm])=>!stylesS.includes('w:styleId="'+nm+'"'))
    .map(([nm,olvl,color])=>
      '<w:style w:type="paragraph" w:styleId="'+nm+'"><w:name w:val="'+nm+'"/><w:qFormat/>'+
      '<w:pPr><w:keepNext/><w:spacing w:before="200" w:after="120"/><w:outlineLvl w:val="'+olvl+'"/></w:pPr>'+
      '<w:rPr><w:b/><w:color w:val="'+color+'"/><w:sz w:val="'+(olvl===0?30:26)+'"/></w:rPr></w:style>').join("");
  if(defs) nuevosEstilos=stylesS.replace("</w:styles>",defs+"</w:styles>");
  zip.file("word/document.xml",nuevoDoc);
  zip.file("word/styles.xml",nuevosEstilos);
  const datos=await zip.generateAsync({type:"uint8array"});
  return {datos, aplicados};
}

/* -------------------------------------------------------- API pública */
async function procesarDocx(arrayBuffer, nombreArchivo, JSZipImpl, DOMParserImpl){
  const zip=await JSZipImpl.loadAsync(arrayBuffer);
  const leer=async n=>{
    if(!zip.file(n)) return null;
    const s=await zip.file(n).async("string");
    return s.replace(/^\uFEFF/,"");
  };
  const [docS,relsS,stylesS,numS]=await Promise.all([
    leer("word/document.xml"),leer("word/_rels/document.xml.rels"),
    leer("word/styles.xml"),leer("word/numbering.xml")]);
  if(!docS) throw new Error("El archivo no contiene word/document.xml — ¿es un .docx válido?");
  const P=new DOMParserImpl();
  const docXml=P.parseFromString(docS,"text/xml");
  const rels=mapaRels(relsS?P.parseFromString(relsS,"text/xml"):null);
  const estilos=mapaEstilos(stylesS?P.parseFromString(stylesS,"text/xml"):null);
  const contador=crearContador(mapaNumeracion(numS?P.parseFromString(numS,"text/xml"):null));
  // precargar textos de SmartArt (word/diagrams/dataN.xml)
  const diagramas={};
  for(const target of Object.values(rels)){
    if(!/diagrams\/data\d*\.xml$/.test(target)) continue;
    const ruta="word/"+target.replace(/^\.\.\//,"").replace(/^\/+/,"");
    const s=await leer(ruta) || await leer(target);
    if(!s) continue;
    const dx=P.parseFromString(s,"text/xml");
    const textos=[];
    for(const pt of desc(dx,DGM,"pt")){
      const tipo=pt.getAttribute("type");
      if(tipo==="parTrans"||tipo==="sibTrans") continue;
      let t="";for(const a of desc(pt,A,"t")) t+=a.textContent||"";
      t=t.trim(); if(t) textos.push(t);
    }
    if(textos.length) diagramas[target]=textos;
  }
  let bloques=extraerBloques(docXml,{estilos,rels,contador,diagramas});
  bloques=agruparBloques(bloques);
  bloques=agruparFocDelimitados(bloques);
  const figuras=asignarFiguras(bloques);
  clasificarFocalizadores(bloques);
  const curso=construirCurso(bloques,nombreArchivo,{figuras:figuras.length});
  // extraer bytes de las imágenes para guardarlas como Imagenes/FiguraN
  const imagenes=[];
  const MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",
              webp:"image/webp",bmp:"image/bmp",svg:"image/svg+xml",
              emf:"image/emf",wmf:"image/wmf",tif:"image/tiff",tiff:"image/tiff"};
  for(const f of figuras){
    const file=zip.file(f.ruta_zip)||zip.file(f.ruta_zip.replace(/^word\//,""));
    if(!file) continue;
    const datos=await file.async("uint8array");
    const ext=f.nombre.split(".").pop().toLowerCase();
    imagenes.push({nombre:f.nombre,mime:MIME[ext]||"application/octet-stream",datos});
  }
  return {curso,imagenes};
}

root.PipelineGuia={procesarDocx,construirCurso,extraerBloques,agruparBloques,
                   asignarFiguras,clasificarFocalizadores,mapaEstilos,mapaRels,
                   mapaNumeracion,crearContador,mapaEstilosGD,generarDocxEtiquetado};
})(typeof window!=="undefined"?window:(typeof module!=="undefined"?module.exports:this));

<script>/* Generador de páginas Canvas "Rediseño 3" (UTPL) a partir del JSON de curso.
   Produce: fragmento ed-container por semana + página de inicio, y la vista
   previa completa (fragmento + CSS del tema + JS mínimo de tabs/collapse). */
